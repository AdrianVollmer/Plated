repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: type checker
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
  - repo: https://github.com/djlint/djLint
    rev: v1.39.2
    hooks:
      - id: djlint-reformat-django
      - id: djlint-django
